# Production Docker Compose with Caddy TLS
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: receipt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receipt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-receipt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receipt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: receipt_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receipt_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-receipt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-receipt}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-receipt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-receipt}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - DEBUG=false
      # OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${BACKEND_URL}/api/auth/google/callback
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=${BACKEND_URL}/api/auth/microsoft/callback
      # Security - REQUIRED
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${SECRET_KEY}
      # Optional LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      # Storage
      - ATTACHMENT_STORAGE_PATH=/app/data/attachments
    volumes:
      - attachment_data:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8000"

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: receipt_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-receipt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-receipt}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-receipt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-receipt}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      # OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${BACKEND_URL}/api/auth/google/callback
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=${BACKEND_URL}/api/auth/microsoft/callback
      # Security
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${SECRET_KEY}
      # Optional LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      # Storage
      - ATTACHMENT_STORAGE_PATH=/app/data/attachments
    volumes:
      - attachment_data:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # Celery Beat Scheduler
  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: receipt_beat
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-receipt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-receipt}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-receipt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-receipt}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app beat --loglevel=info
    networks:
      - internal

  # React Frontend (built and served by Caddy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: receipt_frontend_build
    volumes:
      - frontend_build:/app/dist
    command: npm run build

  # Caddy Reverse Proxy with TLS
  caddy:
    image: caddy:2-alpine
    container_name: receipt_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_build:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - external

volumes:
  postgres_data:
  redis_data:
  attachment_data:
  frontend_build:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
