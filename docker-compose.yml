# Development Docker Compose
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: receipt_postgres
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt
      POSTGRES_DB: receipt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: receipt_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receipt_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://receipt:receipt@postgres:5432/receipt
      - DATABASE_URL_SYNC=postgresql://receipt:receipt@postgres:5432/receipt
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - DEBUG=true
      # OAuth - set these in .env file
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=http://localhost:8000/api/auth/google/callback
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=http://localhost:8000/api/auth/microsoft/callback
      # Security
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Optional LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      # Storage
      - ATTACHMENT_STORAGE_PATH=/app/data/attachments
    volumes:
      - ./backend:/app
      - attachment_data:/app/data/attachments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: receipt_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://receipt:receipt@postgres:5432/receipt
      - DATABASE_URL_SYNC=postgresql://receipt:receipt@postgres:5432/receipt
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      # OAuth - same as backend
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=http://localhost:8000/api/auth/google/callback
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=http://localhost:8000/api/auth/microsoft/callback
      # Security
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Optional LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      # Storage
      - ATTACHMENT_STORAGE_PATH=/app/data/attachments
    volumes:
      - ./backend:/app
      - ./worker:/app/worker
      - attachment_data:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat Scheduler
  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: receipt_beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://receipt:receipt@postgres:5432/receipt
      - DATABASE_URL_SYNC=postgresql://receipt:receipt@postgres:5432/receipt
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app beat --loglevel=info

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: receipt_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  attachment_data:
